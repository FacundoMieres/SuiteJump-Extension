<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1E4FD6"/>
      <stop offset="1" stop-color="#12B5C9"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- Target -->
  <circle cx="100" cy="100" r="13" fill="none" stroke="#fff" stroke-width="6" opacity="0.6"/>
  <!-- Jump arc -->
  <path d="M28 92 Q64 14 90 74" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <!-- Arrowhead landing on the target -->
  <polygon points="98,92 102,67 76,78" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  <!-- Starting point -->
  <circle cx="28" cy="92" r="10" fill="#fff"/>
</svg>
