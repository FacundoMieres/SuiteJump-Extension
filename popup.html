<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SuiteJump</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="logo" src="icons/icon32.png" alt="SuiteJump" width="24" height="24">
    <input id="q" type="search" data-i18n-placeholder="ui.placeholder" autocomplete="off" autofocus>
    <button id="refresh" data-i18n-title="ui.refresh">⟳</button>
    <select id="lang" data-i18n-title="ui.language"></select>
  </header>
  <div id="filters"></div>
  <div id="status"></div>
  <ul id="results"></ul>
  <footer>
    <span id="account"></span>
    <span class="hint" data-i18n="ui.hint"></span>
  </footer>
  <script src="i18n.js"></script>
  <script src="registry.js"></script>
  <script src="fetcher.js"></script>
  <script src="indexer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
